[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
arena = { path = "crates/arena" }
asm = { path = "crates/asm" }
pbc = { path = "crates/pbc" }
vm = { path = "crates/vm" }
verify = { path = "crates/verify" }
corpus = { path = "crates/corpus" }
exec = { path = "crates/exec" }
proptest = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
